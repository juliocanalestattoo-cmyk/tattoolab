// Auto-update fechas section from entered data
function updateFechasAuto() {
  var lines = [];
  // Pareja/conyuge birthday
  var parejaId = (function(){
    var el = document.querySelector('input[name="v-civil"]:checked');
    return el ? el.value : '';
  })();
  var pfx = (parejaId === 'casado') ? 'vp-casado' : (parejaId === 'viudo') ? 'vp-viudo' : 'vp-pareja';
  var pNac = document.getElementById(pfx+'-nac');
  var pNom = document.getElementById(pfx+'-nombre');
  if(pNac && pNac.value && pNom && pNom.value) {
    lines.push('💑 Cumpleanos de ' + pNom.value + ': ' + formatDateDisplay(pNac.value));
  }
  // Hijos
  for(var i = 1; i <= 5; i++) {
    var hNom = document.getElementById('hijo-'+i+'-nombre');
    var hNac = document.getElementById('hijo-'+i+'-nac');
    if(hNom && hNac && hNom.value && hNac.value) {
      lines.push('👶 Cumpleanos de ' + hNom.value + ': ' + formatDateDisplay(hNac.value));
    }
  }
  // Padres
  for(var j = 1; j <= padreCount; j++) {
    var pad = document.getElementById('padre-'+j+'-nombre');
    var padNac = document.getElementById('padre-'+j+'-nac');
    var padRel = document.getElementById('padre-'+j+'-rel');
    if(pad && padNac && pad.value && padNac.value) {
      lines.push((padRel ? padRel.value : 'Padre/Madre') + ' ' + pad.value + ': ' + formatDateDisplay(padNac.value));
    }
  }
  // Hermanos
  for(var k = 1; k <= hermanoCount; k++) {
    var her = document.getElementById('hermano-'+k+'-nombre');
    var herNac = document.getElementById('hermano-'+k+'-nac');
    if(her && herNac && her.value && herNac.value) {
      lines.push('👫 Cumpleanos de ' + her.value + ': ' + formatDateDisplay(herNac.value));
    }
  }
  // Hito nacimiento
  var hNacNom = document.getElementById('h-nac-nombre');
  var hNacFec = document.getElementById('h-nac-fecha');
  if(hNacNom && hNacFec && hNacNom.value && hNacFec.value) {
    lines.push('👶 Nacimiento de ' + hNacNom.value + ': ' + formatDateDisplay(hNacFec.value));
  }
  // Hito matrimonio
  var hMatNom = document.getElementById('h-mat-nombre');
  var hMatFec = document.getElementById('h-mat-fecha');
  if(hMatNom && hMatFec && hMatNom.value && hMatFec.value) {
    lines.push('💍 Matrimonio/compromiso con ' + hMatNom.value + ': ' + formatDateDisplay(hMatFec.value));
  }
  var el = document.getElementById('fechas-auto-display');
  if(!el) return;
  if(lines.length) {
    el.innerHTML = lines.map(function(l){ return '<div style="padding:3px 0;border-bottom:1px solid #EEF2FF;">'+l+'</div>'; }).join('');
  } else {
    el.innerHTML = '<span style="color:var(--muted);font-size:11px;">Se completara automaticamente al llenar los datos de personas e hitos...</span>';
  }
}

function showZodiacNext(inp) {
  var z = getZodiacFromDate(inp.value);
  // Try to find zodiac display by id convention
  var zId = inp.id + '-zodiac';
  var zEl = document.getElementById(zId);
  if(!zEl) {
    // fallback: next sibling div
    zEl = inp.nextElementSibling;
  }
  if(zEl) zEl.textContent = z ? z : '';
  updateFechasAuto();
}

function getZodiacFromDate(dateStr) {
  if(!dateStr) return '';
  var parts = dateStr.split('-');
  if(parts.length !== 3) return '';
  var month = parseInt(parts[1]);
  var day = parseInt(parts[2]);
  var signs = [
    {n:'Capricornio',m:1,d:19},{n:'Acuario',m:2,d:18},{n:'Piscis',m:3,d:20},
    {n:'Aries',m:4,d:19},{n:'Tauro',m:5,d:20},{n:'Geminis',m:6,d:20},
    {n:'Cancer',m:7,d:22},{n:'Leo',m:8,d:22},{n:'Virgo',m:9,d:22},
    {n:'Libra',m:10,d:22},{n:'Escorpio',m:11,d:21},{n:'Sagitario',m:12,d:21},
    {n:'Capricornio',m:12,d:99}
  ];
  for(var i=0;i<signs.length;i++){
    if(month<signs[i].m||(month===signs[i].m&&day<=signs[i].d)){return signs[i].n;}
  }
  return 'Capricornio';
}

function formatDateDisplay(dateStr) {
  if(!dateStr) return '';
  var parts = dateStr.split('-');
  if(parts.length !== 3) return dateStr;
  var months = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var zodiac = getZodiacFromDate(dateStr);
  return parseInt(parts[2]) + ' de ' + months[parseInt(parts[1])-1] + ' de ' + parts[0] + (zodiac ? ' (' + zodiac + ')' : '');
}
