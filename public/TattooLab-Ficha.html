t:space-between;align-items:center;margin-bottom:30px}.sub{color:var(--muted);line-height:1.7;font-size:13px}.btn{border:1px solid var(--line);padding:12px 17px;border-radius:7px;background:#fff;font-weight:600;font-size:12px;display:inline-block;color:var(--ink);text-decoration:none}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.lime{background:var(--lime);border-color:var(--lime)}.btn:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.stat strong{display:block;font:600 32px Manrope;margin:12px 0 5px}.stat small{letter-spacing:0;font-size:12px}.stat.highlight{background:#edf1e2}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(270px,1fr);gap:22px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.pill{font-size:10px;padding:6px 9px;border-radius:5px;background:#f0f1eb;color:#68715b;display:inline-block}.pill.amber{background:#fcf2db;color:#9b742c}.pill.green{background:#eaf2df;color:#46652e}.appointment{display:flex;gap:18px;padding:22px 0;border-top:1px solid var(--line);align-items:flex-start}.time{min-width:53px;font-weight:700;font-size:13px}.time small{letter-spacing:0;font-size:10px;margin-top:6px}.apptinfo{flex:1}.apptinfo h3{margin-bottom:7px}.apptinfo .pill{margin-top:10px}.round{height:34px;width:34px;border:1px solid var(--line);border-radius:50%;background:#fff}.note{background:#f4f6ed;padding:16px;border-radius:8px;color:#69725b;line-height:1.7;font-size:12px;margin:18px 0}.steps{list-style:none;padding:0;margin:20px 0}.steps li{display:flex;gap:12px;align-items:center;padding:12px 0;color:var(--muted);font-size:12px}.steps i{font-style:normal;border:1px solid var(--line);border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:10px}.steps .done{color:var(--ink)}.steps .done i{background:var(--lime);border:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:11px;color:#68705f;margin-bottom:7px}input,textarea{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;background:#fcfcfa;color:var(--ink)}textarea{min-height:80px;resize:vertical}input:focus,textarea:focus,button:focus-visible{outline:2px solid #a0b75d;outline-offset:2px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}.row span{color:var(--muted)}.row.total{font-size:19px;font-weight:700;border:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.check{display:flex;gap:10px;align-items:flex-start;padding:12px 0;line-height:1.6;font-size:12px;color:var(--ink)}.check input{width:17px;height:17px;flex-shrink:0;margin-top:2px;accent-color:#5d7835}.section-label{font-size:10px;letter-spacing:1px;color:var(--green);margin-bottom:10px}.client-head{background:var(--ink);color:white;border-radius:12px;padding:24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}.client-head .sub{color:#bdc3b5}.signature{border:1px dashed #bbc3a9;border-radius:8px;width:100%;height:140px;touch-action:none;background:#fafbf6}.banner{padding:12px 16px;background:#eaf0dc;color:#53633b;border-radius:8px;font-size:12px;margin-bottom:20px}.locked{text-align:center;padding:65px 25px}.locked h2{margin:20px 0 10px}.emptyicon{font-size:32px}.money{font-size:30px;font-weight:600;letter-spacing:-1px;margin:15px 0}footer{max-width:1260px;margin:auto;padding:18px 42px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;justify-content:space-between}footer button{border:0;background:none;color:var(--muted);font-size:10px;text-decoration:underline}#toast{position:fixed;bottom:25px;right:25px;backgro </style><body><aside><div class="brand">tattoo<span>lab</span><sup>®</sup></div><small>ESPACIO DEL ESTUDIO</small><nav><button onclick="go('today')" data-page="today">◫ <span>Hoy</span></button><button onclick="go('booking')" data-page="booking">▦ <span>Reserva y abono</span></button><button onclick="go('client')" data-page="client">◎ <span>Ficha del cliente</span></button><button onclick="go('session')" data-page="session">↗ <span>Sesión y cierre</span></button><button onclick="go('finance')" data-page="finance" id="finance-nav">$ <span>Finanzas privadas</span></button></nav><div class="aside-bottom"><div class="avatar">JC</div><b>Julio Canales</b><small>Artista · TattooLab</small></div></aside><div class="shell"><header><span>ESTUDIO / <b id="crumb">HOY</b></span><div><span class="demo">● PROTOTIPO · DATOS FICTICIOS</span><select id="role" aria-label="Vista del prototipo" onchange="changeViewRole()"><option>Vista administrador</option><option>Vista artista</option><option>Vista asistente</option><option>Vista cliente</option></select></div></header><main id="main"></main><footer>Hecho para el ritmo de tu estudio. <button onclick="reset()">Reiniciar demostración</button></footer></div><div id="toast" role="status"></div><script>const KEY='tattoolab-generic-session-v1';const day=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santiago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const initial=()=>({verified:false,arrival:'',submitted:false,reviewed:false,started:false,closed:false,hours:6,rate:60000,reference:'',notes:'',signature:'',signedAt:'',paid:0,applyDeposit:false,depositApplied:0,depositRemaining:60000,projectComplete:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))||initial()}catch{s=initial()}let page='today';const $=id=>document.getElementById(id);const cash=n=>'$'+Number(n).toLocaleString('es-CL');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const artist=()=>['Vista artista','Vista administrador'].includes($('role').value);const activeArrival=()=>s.arrival===day();function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('No se pudo guardar en este navegador.')} }function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4000)}function go(p){page=p;render();window.scrollTo(0,0)}function reset(){if(confirm('¿Reiniciar los datos ficticios del recorrido?')){s=initial();save();go('today')}}function badge(){return s.closed?'Sesión cerrada':s.started?'En sesión':s.reviewed?'Lista para iniciar':s.submitted?'Revisión pendiente':activeArrival()?'Ficha habilitada':s.verified?'Reserva confirmada':'Verificar abono'}function intro(k,title,sub,action=''){return `<div class="intro"><div><small>${k}</small><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}function steps(){return `<ol class="steps">${[[s.verified,'Abono verificado'],[activeArrival(),'Cliente presente hoy'],[s.submitted,'Ficha y firma enviadas'],[s.reviewed,'Revisión del artista'],[s.closed,'Sesión y pago registrados']].map(([done,t],i)=>`<li class="${done?'done':''}"><i>${done?'✓':i+1}</i>${t}</li>`).join('')}</ol>`}function today(){return intro('TU ESTUDIO, EN ORDEN','Todo listo para crear.','Un vistazo a las citas y a lo que necesita tu atención.',`<button class="btn primary" onclick="go('booking')">Abrir reserva de prueba ↗</button>`)+`<div class="stats"><div class="stat"><small>CITAS DE DEMOSTRACIÓN</small><strong>01</strong><small>Proyecto · primera sesión</small></div><div class="stat"><small>ABONO ${s.verified?'VERIFICADO':'POR VERIFICAR'}</small><strong>$60.000</strong><small>${s.verified?'Transferencia confirmada manualmente':'Pendiente de revisar en la cartola'}</small></div><div class="stat highlight"><small>ESTADO DEL RECORRIDO</small><strong>${s.closed?'05':s.reviewed?'04':s.submitted?'03':activeArrival()?'02':'01'}<span style="font-size:14px;color:#8d9878"> / 05</span></strong><small>${badge()}</small></div></div><div class="grid"><section><div class="card"><div class="cardtop"><h2>Agenda de hoy</h2><span class="pill">DEMO · ${day()}</span></div><div class="appointment"><div class="time">11:00<small>19:00</small></div><div class="avatar">AM</div><div class="apptinfo"><h3></h3><p class="sub">Restauración / cover up · Antebrazo</p><span class="pill ${s.verified?'green':'amber'}">${badge()}</span></div><button class="round" aria-label="Abrir reserva" onclick="go('booking')">↗</button></div><div class="note">Una sola reserva conecta los datos administrativos, la ficha del día y el cierre de la sesión.</div></div><div class="card"><h2>Tu agenda sigue en Calendar</h2><p class="sub" style="margin-top:12px">En esta demostración la cita es ficticia. La conexión con Google Calendar y el envío por WhatsApp se implementarán en la versión operativa.</p></div></section><section><div class="card"><small>PRÓXIMA ACCIÓN</small><h2 style="margin-top:14px">${!s.verified?'Revisar el abono':!activeArrival()?'Registrar la llegada':!s.submitted?'Completar la ficha':!s.reviewed?'Revisar antecedentes':'Cerrar el recorrido'}</h2>${steps()}<button class="btn lime" onclick="go('${!s.verified||!activeArrival()?'booking':!s.submitted?'client':'session'}')">Continuar atención →</button></div></section></div>`}function booking(){return intro('RESERVA / SESIÓN 01','Cada detalle, en su lugar.','Datos preparados por tu asistente antes de la atención.')+`<div class="grid"><section><div class="card"><div class="cardtop"><h2>Reserva de Cliente</h2><span class="pill">Datos ficticios</span></div><div class="fields"><div><label>Nombre</label><input value="" readonly></div><div><label>Correo</label><input value="" readonly></div><div><label>Fecha de demostración</label><input value="${day()}" readonly></div><div><label>Horario reservado</label><input value="11:00 – 19:00 · 8 horas" readonly></div><div><label>Proyecto</label><input value="Restauración / cover up" readonly></div><div><label>Zona</label><input value="Antebrazo" readonly></div></div><p class="sub" style="margin-top:16px">Tarifa acordada: $60.000/hora · Referencia de sesión mínima: 6 horas.</p></div><form class="card" onsubmit="verify(event)"><div class="cardtop"><h2>Verificación del abono</h2><span class="pill ${s.verified?'green':'amber'}">${s.verified?'Verificado':'Pendiente'}</span></div><div class="money">$60.000 <span class="sub">CLP · Transferencia · Abono del proyecto</span></div><label for="reference">Referencia del movimiento bancario de prueba</label><input id="reference" required value="${esc(s.reference)}" placeholder="Ej. TRX-DEMO-001" ${s.verified?'disabled':''}><label class="check"><input type="checkbox" required ${s.verified?'checked disabled':''}>Confirmo que revisé el abono en la cartola (simulación).</label><button class="btn primary" ${s.verified?'disabled':''}>${s.verified?'✓ Abono registrado':'Confirmar abono de prueba'}</button></form></section><section><div class="card"><h2>Recepción del cliente</h2><p class="sub" style="margin-top:12px">La ficha se habilita al registrar su llegada y permanece disponible durante el día de la atención.</p><div class="actions"><button class="btn lime" onclick="arrive()" ${!s.verified||activeArrival()?'disabled':''}>${activeArrival()?'✓ Cliente presente':'Marcar llegada de prueba'}</button><button class="btn" onclick="go('client')" ${!activeArrival()?'disabled':''}>Abrir ficha del cliente →</button></div><div class="note">Aquí probamos el formulario dentro del prototipo. El enlace individual para el cliente se incorporará con las cuentas y permisos reales.</div></div><div class="card"><h2>Documentos de la reserva</h2><div class="doc">Condiciones económicas <span>BORRADOR</span></div><div class="doc">Políticas del estudio <span>BORRADOR</span></div><div class="doc">Preparación y cuidados <span>BORRADOR</span></div><p class="sub" style="margin-top:15px">Se incorporarán los documentos reales que usa el estudio. Sus contenidos no se han extraído de las capturas.</p></div></section></div>`}function verify(e){e.preventDefault();s.verified=true;s.reference=$('reference').value.trim();save();render();toast('Abono de prueba verificado. Puedes registrar la llegada.')}function arrive(){if(!s.verified)return;s.arrival=day();save();render();toast('Llegada registrada. La ficha está habilitada para hoy.')}function client(){const head=intro('VISTA DEL CLIENTE','Antes de comenzar.','Un momento para revisar tu información y preparar tu sesión.');if(!activeArrival())return head+`<div class="card locked"><div class="emptyicon">◎</div><h2>Tu ficha se habilita al llegar</h2><p class="sub">Primero registra la llegada de prueba desde la reserva.</p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="go('booking')">Ir a la reserva</button></div></div>`;if(s.submitted)return head+`<div class="success"><h2>✓ Ficha enviada</h2><p class="sub" style="margin-top:10px">Gracias, Cliente. El artista revisará tus respuestas antes de iniciar la sesión.</p><p class="sub">Registrada: ${esc(s.signedAt)} · Consentimiento de demostración v0.1</p><div class="actions"><button class="btn primary" onclick="go('session')">Continuar como artista →</button></div></div>`;return head+`<div class="banner">Demostración: usa únicamente información ficticia. El consentimiento es un borrador para probar el recorrido.</div><div class="client-head"><div><h2></h2><p class="sub">Restauración / cover up · Antebrazo · ${day()}</p></div><span class="pill">SESIÓN 01</span></div><form id="clientform" onsubmit="submitClient(event)"><div class="grid"><section><div class="card"><div class="section-label">01 / TUS DATOS</div><h2>Confirma tu información</h2><div class="fields" style="margin-top:20px"><div><label for="name">Nombre completo</label><input id="name" required value=""></div><div><label for="email">Correo</label><input id="email" type="email" required value=""></div></div></div><div class="card"><div class="section-label">02 / ANTECEDENTES DEL DÍA</div><h2>Cuéntanos lo que debemos revisar</h2><p class="sub" style="margin:12px 0">Este es un formulario abreviado para validar la experiencia. La versión operativa incorporará los campos revisados de tu ficha original.</p><label for="health">¿Hay alergias, medicamentos o antecedentes que quieras informar?</label><textarea id="health" required placeholder="Usa una respuesta ficticia; si no hay, escribe Ninguno."></textarea><label for="skin" style="margin-top:18px">¿Cómo está la piel de la zona hoy?</label><textarea id="skin" required placeholder="Describe una situación de prueba."></textarea></div><div class="card"><div class="section-label">03 / CONSENTIMIENTO DE PRUEBA</div><h2>Lee y confirma cada declaración</h2><label class="check"><input type="checkbox" required>Confirmo que soy mayor de 18 años.</label><label class="check"><input type="checkbox" required>He revisado los datos y las respuestas de esta demostración.</label><label class="check"><input type="checkbox" required>Entiendo que este formulario prueba el proceso y no autoriza un procedimiento real.</label><label>Firma de prueba</label><canvas id="signature" class="signature" aria-label="Dibuja una firma ficticia"></canvas><button class="btn" type="button" onclick="clearSign()" style="margin-top:8px">Limpiar firma</button><p id="signerror" style="color:#ac422b;display:none;margin-top:10px">Dibuja una firma de prueba para continuar.</p><div class="actions"><button class="btn primary">Enviar ficha de prueba →</button></div></div></section><section><div class="card"><h2>Tu sesión, paso a paso</h2><p class="sub" style="margin-top:14px">Completa esta ficha hoy, antes de tatuarte. Después, el artista revisará tus respuestas contigo.</p><div class="note">Tus notas de salud no se copiarán a la descripción de Google Calendar.</div><p class="sub">En la versión operativa recibirás un acceso individual para tu sesión.</p></div></section></div></form>`}let signed=false;function initSign(){const c=$('signature');if(!c)return;signed=false;const ratio=devicePixelRatio||1;c.width=c.clientWidth*ratio;c.height=140*ratio;const ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.strokeStyle='#252922';ctx.lineWidth=2;ctx.lineCap='round';let down=false;function pos(e){const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(!down)return;signed=true;ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=c.onpointercancel=()=>down=false}function clearSign(){initSign()}function submitClient(e){e.preventDefault();if(!activeArrival()){toast('La ficha debe completarse el día de la llegada.');render();return}if(!signed){$('signerror').style.display='block';return}s.clientName=$('name').value;s.clientEmail=$('email').value;s.health=$('health').value;s.skin=$('skin').value;s.signature=$('signature').toDataURL();s.signedAt=new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'});s.submitted=true;save();go('client')}
function depositAmount(){return s.applyDeposit?Math.min(60000,s.hours*s.rate):0}function balance(){return Math.max(0,s.hours*s.rate-depositAmount())}function session(){const head=intro('VISTA DEL ARTISTA','Del cuidado al cierre.','Revisa los antecedentes y registra el resultado de la sesión.');if(!artist())return head+`<div class="card locked"><h2>Disponible en la vista artista</h2><p class="sub" style="margin-top:12px">Cambia el selector superior para probar la revisión. Este selector simula los roles; las cuentas reales se implementarán después.</p></div>`;if(!s.submitted)return head+`<div class="card locked"><h2>La ficha todavía está pendiente</h2><p class="sub" style="margin:12px 0">El cliente debe completar y firmar el formulario del día.</p><button class="btn primary" onclick="go('client')">Ver ficha del cliente →</button></div>`;return head+`<div class="grid"><section><div class="card"><div class="cardtop"><h2>Antecedentes de la sesión</h2><span class="pill green">Ficha enviada</span></div><div class="row"><span>Cliente</span><b>${esc(s.clientName)}</b></div><div class="row"><span>Fecha y hora</span><b>${esc(s.signedAt)}</b></div><h3 style="margin:20px 0 8px">Salud · respuesta de prueba</h3><p class="sub">${esc(s.health)}</p><h3 style="margin:20px 0 8px">Estado de la piel</h3><p class="sub">${esc(s.skin)}</p><img alt="Firma ficticia registrada" src="${s.signature}" style="width:220px;max-width:100%;height:70px;object-fit:contain;margin-top:18px"><div class="actions"><button class="btn lime" onclick="review()" ${s.reviewed?'disabled':''}>${s.reviewed?'✓ Revisión registrada':'Registrar revisión del artista'}</button><button class="btn primary" onclick="start()" ${!s.reviewed||s.started||!activeArrival()?'disabled':''}>${s.started?'✓ Sesión iniciada':'Iniciar sesión de prueba'}</button></div></div><div class="card"><h2>Registro del procedimiento</h2><label for="notes" style="margin-top:20px">Notas del artista</label><textarea id="notes" ${s.closed?'disabled':''} onchange="s.notes=this.value;save()" placeholder="Diseño realizado, materiales y observaciones de prueba…">${esc(s.notes)}</textarea></div>${s.closed?`<div class="success"><h2>✓ Sesión cerrada</h2><p class="sub" style="margin-top:10px">Pago registrado · ${s.projectComplete?'proyecto terminado':'proyecto continúa'} · abono conservado: ${cash(s.depositRemaining)} · cuidados: ${s.careSentAt?'envío confirmado por el artista':'pendientes de envío'}.</p><div class="actions"><button class="btn" onclick="downloadSummary()">Descargar resumen de prueba</button><button class="btn" onclick="document.getElementById('aftercare-card').scrollIntoView({behavior:'smooth'})">Cuidados y seguimiento ↓</button></div></div>`:''}</section><section><form class="card" onsubmit="closeSession(event)"><h2>Cierre económico</h2><p class="sub" style="margin:12px 0 20px">La reserva ocupa 8 horas. Tú registras las horas que corresponda cobrar.</p><label for="hours">Horas cobradas</label><input id="hours" type="number" min="0.5" max="24" step="0.5" required value="${s.hours}" ${s.closed?'disabled':''} onchange="s.hours=Number(this.value);save();render()"><div class="row"><span>Tarifa acordada</span><b>$60.000 / hora</b></div><div class="row"><span>Valor de la sesión</span><b>${cash(s.hours*s.rate)}</b></div>${s.closed?'':`<label class="check"><input type="checkbox" ${s.projectComplete?'checked':''} onchange="s.projectComplete=this.checked;if(!this.checked)s.applyDeposit=false;save();render()">Esta es la última sesión del proyecto.</label><label class="check"><input type="checkbox" ${s.applyDeposit?'checked':''} ${!s.projectComplete?'disabled':''} onchange="s.applyDeposit=this.checked;save();render()">Aplicar el abono al terminar el proyecto.</label>`}<div class="row"><span>Abono ${s.applyDeposit?'aplicado a esta sesión':'conservado para el proyecto'}</span><b>${s.applyDeposit?'− '+cash(depositAmount()):cash(60000)}</b></div><div class="row total"><span>Saldo</span><b>${cash(balance())}</b></div>${s.closed?'':`<label for="payment">Medio de pago del saldo</label><select id="payment" required style="width:100%" onchange="paymentChanged(this.value)"><option value="">Selecciona…</option><option>Transferencia</option><option>Efectivo</option><option>Tarjeta de débito</option><option>Tarjeta de crédito</option></select><div id="receipt-payment-slot"></div><label class="check"><input type="checkbox" required>Confirmo que recibí el saldo indicado (simulación).</label>`}<button class="btn primary" style="width:100%;margin-top:15px" ${!s.started||s.closed?'disabled':''}>${s.closed?'✓ Cierre registrado':'Registrar pago y cerrar sesión'}</button><p class="sub" style="margin-top:12px;font-size:11px">Por defecto, el abono se conserva para las siguientes sesiones. Solo se descuenta cuando marcas el término del proyecto y eliges aplicarlo.</p></form></section></div>`}function review(){if(!artist()||!s.submitted)return;s.reviewed=true;save();render();toast('Revisión registrada por el artista de prueba.')}function start(){if(!artist()||!s.reviewed||!activeArrival())return;s.started=true;save();render()}function closeSession(e){e.preventDefault();if(!artist()||!s.started||s.closed)return;s.hours=Number($('hours').value);s.payment=$('payment').value;s.closed=true;s.depositApplied=depositAmount();s.depositRemaining=60000-s.depositApplied;s.paid=balance();save();render();toast('Sesión de prueba cerrada.')}function downloadSummary(){const content=`TATTOOLAB · RESUMEN DE DEMOSTRACIÓN\nDatos ficticios. No es una ficha clínica operativa.\nCliente: ${s.clientName}\nFirma registrada: ${s.signedAt}\nConsentimiento: borrador v0.1\nHoras cobradas: ${s.hours}\nValor sesión: ${cash(s.hours*s.rate)}\nAbono aplicado: ${cash(s.depositApplied)}\nAbono conservado para el proyecto: ${cash(s.depositRemaining)}\nProyecto: ${s.projectComplete?'Terminado':'Continúa'}\nSaldo recibido: ${cash(s.paid)}\nMedio: ${s.payment}\nNotas: ${s.notes}`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download='TattooLab-resumen-demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('crumb').textContent={today:'HOY',booking:'RESERVA',client:'FICHA DEL DÍA',session:'SESIÓN'}[page];$('main').innerHTML=({today,booking,client,session}[page])();initSign()}render();
</script><script>const FINKEY='tattoolab-generic-finance-test-v1';const categories=['Sin clasificar','Ingreso de sesiones','Abono de proyecto','Gasto fijo','Gasto variable','Compra extraordinaria','Transferencia propia','Aporte del administrador','Retiro del administrador'];
const financeInitial=()=>({tab:'movements',imported:false,movements:[],providers:[{id:'p1',name:'Espacio Central · Demo',match:'ARRIENDO DEMO',category:'Gasto fijo',frequency:'Mensual'},{id:'p2',name:'Insumos Ink · Demo',match:'INSUMOS DEMO',category:'Gasto variable',frequency:'Según compra'}],recurring:[{id:'r1',name:'Arriendo del estudio',provider:'Espacio Central · Demo',amount:650000,due:5},{id:'r2',name:'Internet',provider:'Conexión Demo',amount:30000,due:10},{id:'r3',name:'Contabilidad',provider:'Gestión Demo',amount:80000,due:15}],opening:1000000,scheduled:1800000,probability:80,variable:200000,extra:0,reserved:180000});let fin;try{fin=JSON.parse(localStorage.getItem(FINKEY))||financeInitial()}catch{fin=financeInitial()}const owner=()=>$('role').value==='Vista administrador';function finSave(){try{localStorage.setItem(FINKEY,JSON.stringify(fin))}catch{toast('No se pudo guardar la demostración.')}}const sum=a=>a.reduce((n,v)=>n+v,0);function financeTotals(){const all=fin.movements;return{incoming:sum(all.filter(m=>m.amount>0).map(m=>m.amount)),outgoing:-sum(all.filter(m=>m.amount<0).map(m=>m.amount)),pending:all.filter(m=>!m.confirmed).length}}function projection(){const fixed=sum(fin.recurring.map(r=>r.amount));const expected=fin.scheduled*fin.probability/100;return{fixed,expected,closing:fin.opening+expected-fixed-fin.variable-fin.extra}}function finTabs(){return `<div class="fin-tabs">${[['movements','Movimientos'],['providers','Proveedores'],['recurring','Gastos recurrentes'],['projection','Proyección mensual']].map(([id,label])=>`<button class="${fin.tab===id?'selected':''}" onclick="fin.tab='${id}';finSave();render()">${label}</button>`).join('')}</div>`}function finance(){if(!owner())return intro('ACCESO DEL DUEÑO','Finanzas privadas.','Cartolas, proveedores y proyecciones del estudio.')+`<div class="card locked"><h2>Disponible en la vista administrador</h2><p class="sub" style="margin-top:12px">Selecciona «Vista administrador» arriba para explorar esta sección de demostración.</p><div class="note">El selector simula los permisos. La aplicación operativa necesitará cuentas y controles de acceso reales.</div></div>`;return intro('FINANZAS / SOLO ADMINISTRADOR','Claridad para decidir.','Entiende los movimientos de tu estudio y anticipa el próximo mes.')+`<div class="banner">Datos ficticios · guardado en este navegador. Los permisos se simulan; no cargues cartolas reales en esta versión.</div>`+finTabs()+({movements:movementsView,providers:providersView,recurring:recurringView,projection:projectionView}[fin.tab])()}
function movementsView(){const t=financeTotals();return `<div class="stats"><div class="stat"><small>ENTRADAS BANCARIAS · DEMO</small><strong>${cash(t.incoming)}</strong><small>Incluye abonos y otros ingresos</small></div><div class="stat"><small>SALIDAS BANCARIAS · DEMO</small><strong>${cash(t.outgoing)}</strong><small>Clasificación separada del movimiento</small></div><div class="stat highlight"><small>POR REVISAR</small><strong>${t.pending.toString().padStart(2,'0')}</strong><small>Sin confirmar o sin clasificar</small></div></div><div class="card"><div class="cardtop"><div><h2>Conciliación de movimientos</h2><p class="sub" style="margin-top:8px">Muestra ficticia del mes de octubre de 2026.</p></div><button class="btn primary" onclick="importDemo()">${fin.imported?'Volver a importar muestra':'Importar cartola de ejemplo'}</button></div><div class="note">El botón carga una muestra incorporada, no un archivo bancario. Puedes repetirlo para comprobar que los movimientos no se duplican. La lectura de Excel real queda para la siguiente etapa.</div>${fin.imported?`<div class="table-scroll"><table class="fin-table"><thead><tr><th>Fecha / movimiento</th><th>Contraparte</th><th>Monto</th><th>Clasificación</th><th>Revisión</th></tr></thead><tbody>${fin.movements.map(m=>`<tr><td>${esc(m.date)}<small>${esc(m.id)}</small></td><td><b>${esc(m.description)}</b><small>${esc(m.provider||'Proveedor sin asignar')}</small></td><td class="${m.amount>0?'positive':''}">${m.amount>0?'+':''}${cash(m.amount)}</td><td><select aria-label="Categoría de ${esc(m.id)}" onchange="classify('${m.id}',this.value)" ${m.confirmed?'disabled':''}>${categories.map(c=>`<option ${m.category===c?'selected':''}>${c}</option>`).join('')}</select>${m.category==='Abono de proyecto'?`<select aria-label="Proyecto asociado" onchange="assignProject('${m.id}',this.value)" ${m.confirmed?'disabled':''}><option value="">Asignar proyecto…</option><option value="demo-cover" ${m.project==='demo-cover'?'selected':''}>Alex · Cover up</option></select>`:''}${m.rule?'<small>Sugerencia por regla del proveedor</small>':''}</td><td>${m.confirmed?`<span class="pill green">Verificado</span><button class="linkbtn" onclick="reopenMovement('${m.id}')">Corregir</button>`:`<button class="btn" onclick="confirmMovement('${m.id}')" ${m.category==='Sin clasificar'||(m.category==='Abono de proyecto'&&!m.project)?'disabled':''}>Confirmar</button>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="locked"><h2>Aún no hay movimientos</h2><p class="sub" style="margin-top:10px">Carga la muestra para probar la clasificación y la verificación de un abono.</p></div>`}</div><div class="grid"><div class="card"><h2>Abonos vinculados al proyecto</h2><p class="sub" style="margin-top:12px">Confirmar un movimiento como abono acredita su recepción. El dinero se conserva para el proyecto y solo se aplica al cobro cuando lo decides.</p><div class="row"><span>Abono de Alex</span><b>${fin.movements.some(m=>m.project==='demo-cover'&&m.confirmed)?'Verificado · $60.000':'Pendiente de conciliación'}</b></div></div><div class="card"><h2>Control de importación</h2><p class="sub" style="margin-top:12px">Clave de esta muestra: cuenta de demostración + número de movimiento. Fechas o montos iguales no bastan para considerar dos pagos duplicados.</p></div></div>`}
function importDemo(){if(!owner())return;const sample=[{id:'DEMO-1001',date:'21/10/2026',description:'Transferencia Alex Demo',amount:60000,category:'Sin clasificar',project:''},{id:'DEMO-1002',date:'22/10/2026',description:'ARRIENDO DEMO',amount:-650000,category:'Sin clasificar'},{id:'DEMO-1003',date:'23/10/2026',description:'INSUMOS DEMO',amount:-95000,category:'Sin clasificar'},{id:'DEMO-1004',date:'26/10/2026',description:'Pago sesión cliente Demo',amount:360000,category:'Sin clasificar'},{id:'DEMO-1005',date:'27/10/2026',description:'Compra equipo Demo',amount:-120000,category:'Sin clasificar'},{id:'DEMO-1006',date:'28/10/2026',description:'Movimiento entre cuentas Demo',amount:-100000,category:'Sin clasificar'}];let added=0;for(const m of sample){if(fin.movements.some(x=>x.id===m.id))continue;const p=fin.providers.find(p=>p.match&&m.description.toUpperCase().includes(p.match.toUpperCase()));if(p){m.provider=p.name;m.category=p.category;m.rule=true}m.confirmed=false;fin.movements.push(m);added++}fin.imported=true;finSave();render();toast(added?`${added} movimientos ficticios cargados. Revisa las sugerencias.`:'Sin movimientos nuevos: se omitieron 6 duplicados.')}function classify(id,v){if(!owner())return;const m=fin.movements.find(m=>m.id===id);if(!m||m.confirmed)return;m.category=v;m.rule=false;if(v!=='Abono de proyecto')m.project='';finSave();render()}function assignProject(id,v){if(!owner())return;const m=fin.movements.find(m=>m.id===id);if(m&&!m.confirmed){m.project=v;finSave();render()}}function confirmMovement(id){if(!owner())return;const m=fin.movements.find(m=>m.id===id);if(!m||m.confirmed||m.category==='Sin clasificar')return;if(m.category==='Abono de proyecto'){if(m.amount!==60000||m.project!=='demo-cover'){toast('La muestra requiere vincular el ingreso de $60.000 al proyecto de Alex.');return}s.verified=true;s.reference=m.id;save()}m.confirmed=true;finSave();render();toast('Clasificación confirmada.')}function reopenMovement(id){if(!owner())return;const m=fin.movements.find(m=>m.id===id);if(!m)return;if(m.category==='Abono de proyecto'&&(s.started||s.closed)){toast('El abono ya está asociado a una sesión iniciada. Reinicia la demostración para corregirlo.');return}if(m.category==='Abono de proyecto'){s.verified=false;s.reference='';save()}m.confirmed=false;finSave();render()}
function providersView(){return `<div class="grid"><section><div class="card"><h2>Proveedores y reglas</h2><p class="sub" style="margin:12px 0 20px">La regla propone una clasificación. Tú confirmas cada movimiento.</p>${fin.providers.map(p=>`<div class="provider"><div class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</div><div><h3>${esc(p.name)}</h3><p class="sub">${esc(p.category)} · ${esc(p.frequency)}</p><small>Si la descripción contiene: ${esc(p.match)}</small></div></div>`).join('')}</div></section><form class="card" onsubmit="addProvider(event)"><h2>Agregar proveedor de prueba</h2><label for="p-name" style="margin-top:20px">Nombre del proveedor</label><input id="p-name" required maxlength="100" placeholder="Ej. Limpieza Demo"><label for="p-match" style="margin-top:15px">Texto para reconocerlo en la cartola</label><input id="p-match" required minlength="3" maxlength="80" placeholder="Ej. LIMPIEZA DEMO"><label for="p-cat" style="margin-top:15px">Categoría habitual</label><select id="p-cat"><option>Gasto fijo</option><option>Gasto variable</option><option>Compra extraordinaria</option></select><label for="p-frequency" style="margin-top:15px">Frecuencia</label><select id="p-frequency"><option>Mensual</option><option>Según compra</option><option>Anual</option></select><div class="actions"><button class="btn primary">Guardar proveedor</button></div><p class="sub" style="margin-top:12px">Agregar un proveedor no crea un pago recurrente. Configúralo en la pestaña siguiente.</p></form></div>`}function addProvider(e){e.preventDefault();if(!owner())return;const name=$('p-name').value.trim(),match=$('p-match').value.trim().toUpperCase();if(!name||match.length<3)return;if(fin.providers.some(p=>p.match.toUpperCase()===match)){toast('Ya existe una regla con ese texto.');return}const p={id:'p'+Date.now(),name,match,category:$('p-cat').value,frequency:$('p-frequency').value};fin.providers.push(p);for(const m of fin.movements)if(!m.confirmed&&m.category==='Sin clasificar'&&m.description.toUpperCase().includes(match)){m.category=p.category;m.provider=p.name;m.rule=true}finSave();render();toast('Proveedor guardado. Regla aplicada a movimientos pendientes sin clasificar.')}
function recurringView(){return `<div class="grid"><section><div class="card"><div class="cardtop"><h2>Compromisos mensuales</h2><span class="pill">${cash(projection().fixed)} / mes</span></div>${fin.recurring.map(r=>`<div class="row"><div><b>${esc(r.name)}</b><p class="sub">${esc(r.provider)} · Vence el día ${r.due}</p></div><div><b>${cash(r.amount)}</b><button class="linkbtn" onclick="removeRecurring('${r.id}')">Quitar</button></div></div>`).join('')}<div class="note">Estos montos alimentan la proyección del próximo mes. No se suman a los gastos históricos: la cartola ya registra los pagos realizados.</div></div></section><form class="card" onsubmit="addRecurring(event)"><h2>Agregar gasto recurrente</h2><label for="r-name" style="margin-top:20px">Concepto</label><input id="r-name" required maxlength="80" placeholder="Ej. Suscripción de agenda"><label for="r-provider" style="margin-top:15px">Proveedor</label><input id="r-provider" required maxlength="100" placeholder="Nombre ficticio"><label for="r-amount" style="margin-top:15px">Monto mensual estimado · CLP</label><input id="r-amount" type="number" min="1" max="100000000" required><label for="r-due" style="margin-top:15px">Día de vencimiento</label><input id="r-due" type="number" min="1" max="28" value="5" required><div class="actions"><button class="btn primary">Agregar a la proyección</button></div></form></div>`}function addRecurring(e){e.preventDefault();if(!owner())return;fin.recurring.push({id:'r'+Date.now(),name:$('r-name').value.trim(),provider:$('r-provider').value.trim(),amount:Number($('r-amount').value),due:Number($('r-due').value)});finSave();render()}function removeRecurring(id){if(!owner())return;fin.recurring=fin.recurring.filter(r=>r.id!==id);finSave();render()}
function projectionView(){const p=projection();return `<div class="banner">Escenario de noviembre de 2026 · estimación mensual, no garantía de cobro. Saldo inicial independiente de la cartola de muestra.</div><div class="stats"><div class="stat"><small>COBROS ESTIMADOS AJUSTADOS</small><strong>${cash(p.expected)}</strong><small>${fin.probability}% de ${cash(fin.scheduled)} previstos</small></div><div class="stat"><small>GASTOS ESTIMADOS</small><strong>${cash(p.fixed+fin.variable+fin.extra)}</strong><small>Recurrentes + variables + extraordinarios</small></div><div class="stat highlight"><small>SALDO FINAL PROYECTADO</small><strong>${cash(p.closing)}</strong><small>Saldo inicial + entradas − salidas</small></div></div><div class="grid"><form class="card" onsubmit="updateProjection(event)"><h2>Ajusta tu escenario</h2><div class="fields" style="margin-top:22px">${[['opening','Saldo bancario inicial',fin.opening],['scheduled','Cobros futuros previstos, netos de abonos a aplicar',fin.scheduled],['probability','Porcentaje de cobro esperado (0–100)',fin.probability],['variable','Gastos variables previstos',fin.variable],['extra','Compras extraordinarias previstas',fin.extra],['reserved','Abonos conservados en proyectos pendientes',fin.reserved]].map(([k,l,v])=>`<div><label for="f-${k}">${l}</label><input id="f-${k}" type="number" min="0" max="${k==='probability'?100:1000000000}" required value="${v}"></div>`).join('')}</div><div class="actions"><button class="btn primary">Actualizar proyección</button></div><div class="note">Los cobros futuros deben excluir el abono que se descontará al cliente. Los abonos ya recibidos están incluidos en el saldo bancario inicial y no vuelven a sumarse como ingreso.</div></form><div class="card"><h2>Cómo se calcula</h2><div class="row"><span>Saldo inicial</span><b>${cash(fin.opening)}</b></div><div class="row"><span>+ Cobros estimados</span><b>${cash(p.expected)}</b></div><div class="row"><span>− Gastos recurrentes</span><b>${cash(p.fixed)}</b></div><div class="row"><span>− Gastos variables</span><b>${cash(fin.variable)}</b></div><div class="row"><span>− Extraordinarios</span><b>${cash(fin.extra)}</b></div><div class="row total"><span>Saldo proyectado</span><b>${cash(p.closing)}</b></div><div class="note">De referencia: ${cash(fin.reserved)} en abonos de proyectos pendientes. Es una parte del dinero del estudio asociada a compromisos con clientes; no se resta otra vez como salida bancaria.</div><p class="sub">La proyección no representa utilidad contable y no calcula impuestos. Las fechas de vencimiento se guardan para incorporar después una vista semanal.</p></div></div>`}function updateProjection(e){e.preventDefault();if(!owner())return;for(const k of ['opening','scheduled','probability','variable','extra','reserved'])fin[k]=Number($('f-'+k).value);finSave();render();toast('Proyección actualizada.')}
const baseRender=render;render=function(){const n=$('finance-nav');if(n)n.style.display=owner()?'':'none';if(page!=='finance'){baseRender();return}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('crumb').textContent='FINANZAS PRIVADAS';$('main').innerHTML=finance()};const baseReset=reset;reset=function(){if(confirm('¿Reiniciar el recorrido y las finanzas ficticias?')){s=initial();fin=financeInitial();save();finSave();go('today')}};render();
</script><script>function receiptView(){return `<div style="margin-top:15px"><label for="receipt">Comprobante del pago · imagen de prueba</label><input id="receipt" type="file" accept="image/png,image/jpeg,image/webp" onchange="attachReceipt(this)"><p class="sub" style="font-size:11px;margin-top:8px">PNG, JPG o WebP · máximo 1 MB en esta demostración. Usa una imagen ficticia. El comprobante adjunto no verifica la recepción bancaria.</p><div id="receipt-preview">${receiptPreview()}</div></div>`}function receiptPreview(){return s.receipt?`<a href="${s.receipt.data}" download="comprobante-demo.${s.receipt.ext}"><img src="${s.receipt.data}" alt="Comprobante de prueba adjunto" style="max-width:220px;max-height:140px;object-fit:contain;margin-top:12px"></a><p class="sub">${esc(s.receipt.name)} · adjunto ${esc(s.receipt.at)}</p><button type="button" class="linkbtn" onclick="removeReceipt()">Quitar comprobante de prueba</button>`:'<p class="sub" style="margin-top:8px">Sin comprobante adjunto.</p>'}function paymentChanged(v){$('receipt-payment-slot').innerHTML=['Transferencia','Tarjeta de débito','Tarjeta de crédito'].includes(v)?receiptView():''}async function attachReceipt(input){if(!artist())return;const f=input.files[0];if(!f)return;const types={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'};if(!types[f.type]||f.size>1024*1024){toast('Usa una imagen PNG, JPG o WebP de hasta 1 MB.');input.value='';return}const reader=new FileReader();reader.onload=()=>{const candidate={data:reader.result,ext:types[f.type],name:f.name,at:new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'})};const old=s.receipt;s.receipt=candidate;try{localStorage.setItem(KEY,JSON.stringify(s))}catch{s.receipt=old;toast('No hay espacio para guardar la imagen en este navegador.');return}if($('receipt-preview'))$('receipt-preview').innerHTML=receiptPreview();toast('Comprobante de prueba adjunto; pendiente de conciliación bancaria.')};reader.readAsDataURL(f)}function removeReceipt(){if(!artist())return;s.receipt=null;save();$('receipt-preview').innerHTML=receiptPreview()}
function followupView(){return `<div class="card"><div class="cardtop"><h2>Comprobante del pago</h2><span class="pill">${esc(s.payment||'Sin medio registrado')}</span></div>${['Transferencia','Tarjeta de débito','Tarjeta de crédito'].includes(s.payment)?receiptView():'<p class="sub">El adjunto se habilita para transferencia, tarjeta de débito o tarjeta de crédito.</p>'}</div><div class="grid"><section><form class="card" onsubmit="saveNextSession(event)"><div class="section-label">CONTINUIDAD DEL PROYECTO</div><h2>Agendar la siguiente sesión</h2>${s.projectComplete?'<div class="note">Este proyecto está marcado como terminado. Una nueva reserva debe corresponder a otro proyecto.</div>':s.nextSession?`<div class="success" style="margin-top:18px"><h3>✓ Segunda sesión registrada en la demostración</h3><p class="sub">${esc(s.nextSession.date)} · ${esc(s.nextSession.start)}–${esc(s.nextSession.end)}</p><p class="sub">Abono conservado: ${cash(s.depositRemaining)}. ${s.depositRemaining>0?'No volver a cobrar el mismo abono.':'Revisar abono para la nueva reserva.'}</p><p class="sub">Pendiente de sincronización con Google Calendar.</p><button class="btn" type="button" style="margin-top:10px" onclick="editNextSession()">Modificar reserva</button></div>`:`<p class="sub" style="margin:12px 0 18px">Acuerda la fecha con el cliente antes de que se vaya. La nueva sesión seguirá asociada al mismo proyecto y abono.</p><div class="fields"><div><label for="next-date">Fecha</label><input id="next-date" type="date" min="${day()}" required></div><div><label for="next-start">Hora de inicio</label><input id="next-start" type="time" value="11:00" required onchange="updateNextEnd()"></div><div><label for="next-hours">Horas de trabajo</label><input id="next-hours" type="number" min="0.5" max="20" step="0.5" value="6" required oninput="updateNextEnd()"></div><div><label for="next-end">Hora de término · calculada</label><input id="next-end" type="time" value="19:00" readonly required><p id="next-duration" class="sub" style="margin-top:8px" hidden></p></div><div><label>Abono conservado</label><input readonly value="${cash(s.depositRemaining)}"></div><div class="full"><label for="next-note">Plan para la próxima sesión</label><textarea id="next-note" placeholder="Detalles de prueba…"></textarea></div></div><div class="actions"><button class="btn primary">Guardar segunda sesión de prueba</button></div><p class="sub" style="margin-top:12px">Esta reserva es local. La disponibilidad y los conflictos de Calendar aún no se comprueban.</p>`}</form><form class="card" onsubmit="saveCream(event)"><div class="section-label">PRODUCTO DE CUIDADO</div><h2>¿Se llevó crema al finalizar?</h2><div style="margin-top:18px"><label for="cream-status">Entrega al cliente</label><select id="cream-status" required onchange="creamChanged(this.value)"><option value="">Seleccionar…</option><option value="yes" ${s.cream?.status==='yes'?'selected':''}>Sí, se llevó crema</option><option value="no" ${s.cream?.status==='no'?'selected':''}>No se llevó crema</option><option value="own" ${s.cream?.status==='own'?'selected':''}>Ya tiene una crema propia</option></select></div><div id="cream-details" style="margin-top:15px">${creamFields(s.cream?.status||'')}</div><div class="actions"><button class="btn">Guardar registro de crema</button></div>${s.cream?`<p class="sub" style="margin-top:12px">✓ Registrado: ${esc(s.cream.at)} · ${esc(s.cream.name||'Sin producto entregado')}</p>`:''}<p class="sub" style="margin-top:14px">La entrega queda documentada; no permite comprobar por sí sola que el cliente seguirá los cuidados.</p></form></section><section><form class="card" id="aftercare-card" onsubmit="openCareWhatsApp(event)"><div class="section-label">COMUNICACIÓN CON EL CLIENTE</div><h2>Cuidados por WhatsApp</h2><label for="care-phone" style="margin-top:20px">Teléfono del cliente con código de país</label><input id="care-phone" type="tel" required value="${esc(s.carePhone||'')}" placeholder="+56 9 …"><label for="care-text" style="margin-top:15px">Texto de cuidados del estudio</label><textarea id="care-text" required rows="8" placeholder="Pega aquí el texto de cuidados aprobado que usa tu estudio. Para probar, escribe un mensaje ficticio.">${esc(s.careText||'')}</textarea><div class="note">Revisa el destinatario y el texto. WhatsApp se abrirá con el mensaje preparado; tú debes pulsar Enviar allí.</div><button class="btn primary">Abrir WhatsApp con los cuidados ↗</button><div class="row"><span>Estado registrado</span><b>${s.careReceivedAt?'Recepción confirmada por el cliente':s.careSentAt?'Envío confirmado por el artista':s.careOpenedAt?'WhatsApp abierto · envío pendiente de confirmar':'Pendiente'}</b></div>${s.careSentAt?`<p class="sub">Envío registrado: ${esc(s.careSentAt)}</p>`:''}<div class="actions"><button class="btn" type="button" onclick="confirmCareSent()" ${!s.careOpenedAt||s.careSentAt?'disabled':''}>Confirmo que envié el mensaje</button><button class="btn" type="button" onclick="confirmCareReceived()" ${!s.careSentAt||s.careReceivedAt?'disabled':''}>El cliente confirmó recepción</button></div><p class="sub" style="margin-top:15px">Los estados se registran manualmente en esta demostración. No representan una confirmación de entrega o lectura emitida por WhatsApp.</p></form></section></div>`}
function nextSessionTiming(start,hours){hours=Number(hours);if(!/^\d{2}:\d{2}$/.test(start)||!Number.isFinite(hours)||hours<0.5||hours>20||hours*2%1)throw Error('Indica entre 0,5 y 20 horas de trabajo, en pasos de media hora.');const parts=start.split(':').map(Number);if(parts[0]>23||parts[1]>59)throw Error('Revisa la hora de inicio.');const totalHours=hours+2;const minutes=parts[0]*60+parts[1]+totalHours*60;if(minutes>=1440)throw Error('El bloque debe terminar antes de medianoche. Ajusta el inicio o las horas.');return{end:String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0'),workHours:hours,extraHours:2,totalHours}}function updateNextEnd(){try{const timing=nextSessionTiming($('next-start').value,$('next-hours').value);$('next-end').value=timing.end;$('next-duration').textContent='';$('next-duration').hidden=true;$('next-hours').setCustomValidity('')}catch(err){$('next-end').value='';$('next-duration').textContent=err.message;$('next-duration').hidden=false;$('next-hours').setCustomValidity(err.message)}}function saveNextSession(e){e.preventDefault();if(!artist()||!s.closed||s.projectComplete)return;const date=$('next-date').value,start=$('next-start').value;let timing;try{timing=nextSessionTiming(start,$('next-hours').value)}catch(err){toast(err.message);return}if(date<day()){toast('Elige una fecha desde hoy.');return}s.nextSession={date,start,...timing,note:$('next-note').value,project:'demo-cover',number:2};save();render();toast('Segunda sesión guardada: horas de trabajo más 2 horas adicionales.')}function editNextSession(){if(!artist())return;s.nextSession=null;save();render()}const creamProducts=['Tattoo skin Care','Tattoo Anchor Cheyenne','Aquaphor'];function creamFields(status){return status==='yes'||status==='own'?`<label for="cream-name">${status==='yes'?'Crema entregada':'Crema que declara tener'}</label><select id="cream-name" required><option value="">Selecciona un producto…</option>${creamProducts.map(name=>`<option value="${esc(name)}" ${s.cream?.name===name?'selected':''}>${esc(name)}</option>`).join('')}</select>`:''}function creamChanged(status){$('cream-details').innerHTML=creamFields(status)}function saveCream(e){e.preventDefault();if(!artist()||!s.closed)return;const status=$('cream-status').value;if(!status)return;s.cream={status,name:$('cream-name')?.value.trim()||'',at:new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'})};save();render();toast('Registro de crema guardado.')}
function buildCareUrl(phone,text){const digits=phone.replace(/\D/g,'');if(!/^[1-9]\d{7,14}$/.test(digits))throw Error('Revisa el número e incluye el código de país.');if(!text.trim())throw Error('Escribe los cuidados antes de abrir WhatsApp.');return 'https://wa.me/'+digits+'?text='+encodeURIComponent(text.trim())}function openCareWhatsApp(e){e.preventDefault();if(!artist()||!s.closed)return;let url;try{url=buildCareUrl($('care-phone').value,$('care-text').value)}catch(err){toast(err.message);return}const phone=$('care-phone').value,text=$('care-text').value;const popup=window.open(url,'_blank','noopener,noreferrer');if(phone!==s.carePhone||text!==s.careText){s.careSentAt='';s.careReceivedAt=''}s.carePhone=phone;s.careText=text;s.careOpenedAt=new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'});save();render();toast('Solicitada apertura de WhatsApp. Confirma el envío solo después de enviarlo.')}function confirmCareSent(){if(!artist()||!s.closed||!s.careOpenedAt)return;s.careSentAt=new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'});save();render()}function confirmCareReceived(){if(!artist()||!s.careSentAt)return;s.careReceivedAt=new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'});save();render()}

</script><script>const originalConsentText="De conformidad con el Decreto 304 del Ministerio de Salud de Chile, que aprueba el Reglamento de Tatuajes y Prácticas Similares, y con la normativa sanitaria vigente, declaro lo siguiente:\n\n\n        1. Mayoría de edad. Declaro ser mayor de 18 años y acredito mi identidad. En caso de ser menor de edad, cuento con autorización escrita de mi padre, madre o representante legal, quien me acompañará durante el procedimiento.\n\n\n        2. Información veraz. Confirmo que la información personal y de salud proporcionada es verdadera, completa y actualizada. Entiendo que omitir información relevante puede implicar riesgos para mi salud y el resultado del procedimiento.\n\n\n        3. Estado de la piel. Declaro que la zona a tatuar no presenta heridas abiertas, quemaduras, infecciones, irritación severa, acné inflamado, dermatitis activa, herpes activo, costras, ampollas u otra alteración visible. Entiendo que el tatuador puede suspender o postergar la sesión por razones de seguridad.\n\n\n        4. Conocimiento del procedimiento. He sido informado/a de que el tatuaje es un procedimiento permanente que introduce pigmento en la piel mediante agujas estériles de un solo uso. He recibido información sobre el procedimiento, riesgos y cuidados posteriores.\n\n\n        5. Riesgos conocidos. Declaro conocer y aceptar los riesgos: infección local; inflamación, dolor o enrojecimiento; reacción alérgica a pigmentos; mala cicatrización; formación de queloide; pérdida de pigmento; cambios de coloración; necesidad de retoque; permanencia irreversible del tatuaje.\n\n\n        6. Bioseguridad. He sido informado/a de que el establecimiento usa materiales desechables, agujas estériles de un solo uso y técnica aséptica conforme a la normativa vigente.\n\n\n        7. Cuidados post-procedimiento. Me comprometo a seguir las instrucciones de cuidado entregadas. Entiendo que el resultado final también depende de estos cuidados, de mi tipo de piel y proceso de cicatrización.\n\n\n        8. Consentimiento libre y voluntario. He tenido la oportunidad de hacer preguntas y recibí respuestas satisfactorias. Firmo libremente, sin presión ni coerción, autorizando la realización del procedimiento.\n\n\n        9. Protección de datos — Ley 19.628. Autorizo a TattooLab a registrar y almacenar mis datos personales con fines de identificación, registro del procedimiento, seguimiento y cumplimiento de la normativa sanitaria. Estos datos serán tratados confidencialmente y solo comunicados a la autoridad sanitaria cuando la normativa lo exija.";

function clinicalField(f){const [id,label,type,required]=f;const value=s.clinicalDraft?.[id]||'';let options=type==='yesno'?['Sí','No']:type==='reaction'?['No','Sí','Primer tatuaje']:type==='procedure'?['Tatuaje nuevo','Cobertura','Refuerzo','Sesión complementaria','Mejora compositiva','Mantención estética','Retoque']:type==='image'?['Sí, autorizo','No autorizo']:null;return `<div><label for="clinical-${id}">${esc(label)}${required?' *':''}</label>${options?`<select id="clinical-${id}" ${required?'required':''}><option value="">Selecciona…</option>${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input id="clinical-${id}" type="${type}" value="${esc(value)}" ${required?'required':''} ${id==='birth'?'max="'+day()+'"':''}>`}</div>`}
function clinicalCard(title,fields){return `<div class="card"><h2>${title}</h2><div class="fields" style="margin-top:20px">${fields.map(clinicalField).join('')}</div></div>`}const originalClientView=client;client=function(){let html=originalClientView();if(!activeArrival()||s.submitted)return html;const identity=clinicalCard('Identificación y contacto',clinicalFields.slice(0,11));const health=`<div class="card"><h2>Condiciones de salud declaradas</h2><p class="sub" style="margin:12px 0">Marca las condiciones que correspondan. Si no marcas ninguna, se registrará «Ninguna condición declarada». Usa datos ficticios.</p><div class="fields">${healthConditions.map((x,i)=>`<label class="check"><input id="condition-${i}" type="checkbox" onchange="updateHealthConditionStatus()">${esc(x)}</label>`).join('')}</div><p id="health-condition-status" class="note" role="status">Ninguna condición declarada.</p></div>`+clinicalCard('Medicamentos, alergias y estado de hoy',clinicalFields.slice(11,23));const procedure=clinicalCard('Procedimiento y permiso de imagen',clinicalFields.slice(23))+`<div class="card"><h2>Condiciones económicas del proyecto</h2><div class="row"><span>Tarifa acordada</span><b>$60.000 / hora</b></div><div class="row"><span>Abono del proyecto</span><b>$60.000</b></div><p class="sub" style="margin-top:12px">El abono se conserva entre sesiones y se aplica al terminar el proyecto cuando se acuerda su uso.</p><label class="check"><input id="price-accepted" type="checkbox" required>Revisé la tarifa y las condiciones del abono de esta demostración.</label></div>`;html=html.replace('<div class="section-label">02 / ANTECEDENTES DEL DÍA</div>',identity+health+'<div class="section-label">02 / OBSERVACIONES ADICIONALES</div>');html=html.replace('Este es un formulario abreviado para validar la experiencia. La versión operativa incorporará los campos revisados de tu ficha original.','Puedes añadir aquí contexto a tus respuestas.');html=html.replace('<div class="section-label">0 function clinicalAge(date,today){if(!date||date>today)return -1;const b=date.split('-').map(Number),t=today.split('-').map(Number);return t[0]-b[0]-((t[1]<b[1]||(t[1]===b[1]&&t[2]<b[2]))?1:0)}const previousSubmitClient=submitClient;submitClient=function(e){e.preventDefault();if(!activeArrival()){toast('Completa la ficha el día de la llegada.');return}const data={};for(const [id] of clinicalFields)data[id]=$('clinical-'+id).value.trim();if(clinicalAge(data.birth,day())<18){toast('Esta demostración está configurada solo para mayores de 18 años. Revisa la fecha.');return}for(const [answer,detail] of [['meds','medicationDetail'],['allergies','allergyDetail'],['activeSkin','skinDetail']])if(data[answer]==='Sí'&&!data[detail]){toast('Completa el detalle de '+clinicalFields.find(f=>f[0]===detail)[1].toLowerCase()+'.');$('clinical-'+detail).focus();return}try{buildCareUrl(data.phone,'validación')}catch(err){toast(err.message);return}if(!signed){$('signerror').style.display='block';return}data.conditions=healthConditions.filter((x,i)=>$('condition-'+i).checked);data.consentVersion=clinicalVersion;data.consentText=originalConsentText;data.acceptances={conditionsDeclaration:data.conditions.length?'Condiciones declaradas: requieren revisión del artista':'Ninguna condición declarada',price:$('price-accepted').checked,read:$('consent-read').checked,care:$('consent-care').checked};if(Object.values(data.acceptances).some(x=>!x)){toast('Revisa las declaraciones obligatorias.');return}s.clinical=data;s.carePhone=data.phone;previousSubmitClient(e)};

const previousClinicalCard=clinicalCard;clinicalCard=function(title,fields){if(title!=='Identificación y contacto')return previousClinicalCard(title,fields);return `<div class="card"><h2>Identificación</h2><p class="sub" style="margin:12px 0 20px">Elige tu nacionalidad. Solo verás los campos que correspondan.</p><div class="fields">${[0,1,2,4].map(i=>clinicalField(clinicalFields[i])).join('')}</div><p class="sub" id="contact-foreign-note" hidden style="margin-top:14px">Para clientes extranjeros no se solicita RUT en este prototipo.</p></div><div class="card"><h2>Contacto y residencia</h2><div class="fields" style="margin-top:20px">${clinicalField(clinicalFields[3])}<div><label for="clinical-country">País de residencia</label><input id="clinical-country" list="contact-countries" value="Chile" oninput="contactCountryChanged()" autocomplete="country-name"><datalist id="contact-countries">${['Chile',...Object.keys(contactInternationalCities)].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label for="clinical-city">Ciudad</label><input id="clinical-city" list="contact-cities" onchange="contactCityChanged()" autocomplete="address-level2" placeholder="Selecciona o escribe tu ciudad"><datalist id="contact-cities"></datalist></div><div id="contact-commune"><label for="clinical-commune">Comuna</label><input id="clinical-commune" list="contact-communes" placeholder="Selecciona o escribe tu comuna"><datalist id="contact-communes"></datalist></div><div class="full">${clinicalField(clinicalFields[8])}</div>${clinicalField(clinicalFields[9])}${clinicalField(clinicalFields[10])}</div></div>`};

function artistProcedureEditor(){const a=s.artistProcedure||{};return `<form class="card" onsubmit="saveArtistProcedure(event)"><div class="section-label">COMPLETA EL ARTISTA</div><h2>Diseño y medidas del tatuaje</h2><p class="sub" style="margin:12px 0 20px">Puedes preparar y guardar estos datos antes de que el cliente termine su ficha, durante la atención o después. Se guardan por separado de sus respuestas.</p><div class="fields"><div><label for="artist-height">Alto (cm)</label><input id="artist-height" type="number" min="0.1" max="300" step="0.1" value="${esc(a.height||'')}"></div><div><label for="artist-width">Ancho (cm)</label><input id="artist-width" type="number" min="0.1" max="300" step="0.1" value="${esc(a.width||'')}"></div><div class="full"><label for="artist-design">Descripción del diseño</label><textarea id="artist-design" rows="5">${esc(a.design||'')}</textarea></div><div class="full"><label for="artist-procedure">Tipo de procedimiento</label><select id="artist-procedure" style="width:100%">${selectOptions(['Tatuaje nuevo','Cobertura','Refuerzo','Sesión complementaria','Mejora compositiva','Mantención estética','Retoque'],a.procedure||'')}</select></div></div><div class="actions"><button class="btn primary">Guardar datos del artista</button></div>${a.savedAt?`<p class="sub" style="margin-top:12px">Guardado: ${esc(a.savedAt)}</p>`:''}</form>`}function saveArtistProcedure(e){e.preventDefault();if(!artist())return;const height=$('artist-height').value,width=$('artist-width').value;s.artistProcedure={height,width,size:height||width?`${height||'—'} cm de alto × ${width||'—'} cm de ancho`:'',design:$('artist-design').value.trim(),procedure:$('artist-procedure').value,savedAt:new Date().toLocaleString('es-CL',{timeZone:'America/Santiago'})};save();toast('Diseño y medidas guardados por el artista.')}
const reviewBeforeArtistProcedure=clinicalReview;clinicalReview=function(){return reviewBeforeArtistProcedure().replace(/<div class="row"><span>(?:Extensión o tamaño aproximado|Descripción del diseño|Tipo de procedimiento)<\/span><b[^>]*>[\s\S]*?<\/b><\/div>/g,'')};
const renderBeforeArtistProcedure=render;render=function(){renderBeforeArtistProcedure();if(page==='session'&&artist()){$('main').insertAdjacentHTML('afterbegin',`<div class="card"><h2>🎨 Sección del artista</h2><p class="sub" style="margin-top:8px">Acceso exclusivo para Julio Canales</p><div class="note" style="margin-bottom:0">🔒 <strong>Seccion privada del artista.</strong> Esta informacion no es visible para el cliente ni para el asistente.</div></div>`+artistProcedureEditor());if(!s.submitted)$('main').insertAdjacentHTML('beforeend',`<form class="card" onsubmit="savePrivateNotes(event)"><div class="section-label">NOTAS PRIVADAS DEL ARTISTA</div><h2>Lo que conoces durante la sesión</h2><p class="sub" style="margin:12px 0">Registra solo lo que el cliente comparte voluntariamente. Puedes hacerlo antes o después de recibir su ficha.</p><div class="fields">${privateFields.map(([id,label])=>`<div><label for="private-${id}">${esc(label)}</label><textarea id="private-${id}">${esc(s.privateNotes?.[id]||'')}</textarea></div>`).join('')}</div><button class="btn primary" style="margin-top:20px">Guardar notas privadas</button></form>`)}};render();
</script><script>const isClientRole=()=>$('role').value==='Vista cliente';

const submitBeforeRoleAccess=submitClient;submitClient=function(e){if(!isClientRole()){e.preventDefault();toast('Solo el cliente puede autorizar, firmar y enviar su ficha.');return}submitBeforeRoleAccess(e)};

function saveAdministrativeDraft(){if(!['Vista administrador','Vista asistente'].includes($('role').value)||s.submitted)return;const draft={};for(const [id] of clinicalFields){if(['imagePermission','size','design','procedure'].includes(id))continue;const el=$('clinical-'+id);if(el)draft[id]=el.value}s.clinicalDraft=draft;s.adminName=$('name')?.value||'';s.adminEmail=$('email')?.value||'';if(draft.phone)s.reservationPhone=draft.phone;save();toast('Datos preparados. Las autorizaciones y la firma quedan pendientes del cliente.')}
const renderBeforeRoleAccess=render;render=function(){renderBeforeRoleAccess();if(page!=='client'||s.submitted||!$('clientform')||$('role').value==='Vista artista')return;const isClient=isClientRole();if(!isClient){const image=$('clinical-imagePermission');if(image){image.disabled=true;image.required=false;image.insertAdjacentHTML('afterend','<p class="sub" style="margin-top:10px">Solo el cliente puede elegir esta autorización en su vista.</p>')}document.querySelectorAll('#clientform input[type="checkbox"][required]').forEach(el=>el.disabled=true);const canvas=$('signature');if(canvas){canvas.style.pointerEvents='none';canvas.setAttribute('aria-disabled','true');canvas.insertAdjacentHTML('beforebegin','<p class="note">La firma y las declaraciones deben ser completadas por el cliente.</p>')}document.querySelectorAll('#clientform button').forEach(btn=>{if(btn.type==='submit'||btn.textContent.includes('Enviar ficha')||btn.textContent.includes('Aceptar todas')||btn.textContent.includes('Limpiar firma'))btn.disabled=true});$('clientform').insertAdjacentHTML('beforeend','<div class="card"><button type="button" class="btn primary" onclick="saveAdministrativeDraft()">Guardar datos preparados para el cliente</button></div>')}if(s.clinicalDraft){for(const [id,value] of Object.entries(s.clinicalDraft)){const el=$('clinical-'+id);if(el)el.value=value}contactNationalityChanged();contactCountryChanged();for(const id of ['city','commune'])if(s.clinicalDraft[id])$('clinical-'+id).value=s.clinicalDraft[id];contactAgeChanged();toggleHealthDetails()}if(s.adminName)$('name').value=s.adminName;if(s.adminEmail)$('email').value=s.adminEmail};render();
</script><script>const artistOriginalFragment="\n\n      <div class=\"alert tatuador\" style=\"margin-bottom:14px;\">\n        🔒 <strong>Seccion privada del artista.</strong> Esta informacion no es visible para el cliente ni para el asistente.\n      </div>\n\n      <!-- ═══ BLOQUE 0: RELACIÓN DEL TATUAJE (primero por ser lo más relevante al iniciar) ═══ -->\n      <div class=\"card\" style=\"border-color:#E0E7FF;background:#F5F3FF;\">\n        <div class=\"card-title\" style=\"color:#4338CA;\"><span class=\"num\" style=\"background:#4338CA;\">🖤</span>Relacion del tatuaje con su historia</div>\n        <p style=\"font-size:11px;color:#6B7280;margin-bottom:12px;line-height:1.5;\">El significado detras de la obra. Registra lo que el cliente comparte sobre su decision de tatuarse.</p>\n        <div class=\"fgrid\" style=\"gap:12px;\">\n          <div class=\"fld\">\n            <label>📌 Titulo de la obra</label>\n            <input type=\"text\" id=\"v-titulo-obra\" placeholder=\"El nombre con el que identificaras este tatuaje...\">\n          </div>\n          <div class=\"fgrid col2\" style=\"gap:10px;\">\n            <div class=\"fld\"><label>Motivo del tatuaje</label><input type=\"text\" id=\"v-motivo\" placeholder=\"Por que se lo hace...\"></div>\n            <div class=\"fld\"><label>Persona, etapa o simbolo que representa</label><input type=\"text\" id=\"v-simbolo\" placeholder=\"A quien o que homenajea...\"></div>\n            <div class=\"fld\"><label>Emocion principal asociada</label><input type=\"text\" id=\"v-emocion-tatoo\" placeholder=\"Lo que siente al respecto...\"></div>\n            <div class=\"fld\"><label>Frase, palabra o concepto importante</label><input type=\"text\" id=\"v-frase\" placeholder=\"Si menciono alguna...\"></div>\n          </div>\n          <div class=\"fld\">\n            <label>Nivel de privacidad del significado</label>\n            <div class=\"radio-group\" style=\"margin-top:4px;\">\n              <label class=\"radio-item\">< otidiano -->\n        <div class=\"obs-block\" style=\"background:#EEF2FF;border-color:#C7D2FE;\">\n          <h4 style=\"color:#4338CA;\">3. 🌍 Contexto cotidiano</h4>\n          <p style=\"font-size:10px;color:#6B7280;margin-bottom:8px;\">Ciudad y trabajo pre-completados desde la ficha del cliente.</p>\n          <div class=\"fgrid col2\" style=\"gap:10px;\">\n            <div class=\"fld\"><label>Ciudad / comuna donde vive</label><input type=\"text\" id=\"v-ciudad-vive\" placeholder=\"Auto-completado...\"></div>\n            <div class=\"fld\"><label>Viaja desde</label><input type=\"text\" id=\"v-viaja-desde\" placeholder=\"Si viene de otra ciudad...\"></div>\n          </div>\n          <!-- Trabajo expandido -->\n          <div style=\"background:#fff;border:1px solid #C7D2FE;border-radius:8px;padding:12px;margin-top:10px;\">\n            <p style=\"font-size:11px;font-weight:700;color:#4338CA;margin-bottom:8px;\">💼 Trabajo / Ocupacion</p>\n            <div class=\"fgrid col2\" style=\"gap:8px;\">\n              <div class=\"fld\"><label>Cargo / Rol</label><input type=\"text\" id=\"v-cargo-ctx\" placeholder=\"Su posicion...\"></div>\n              <div class=\"fld\"><label>Empresa / Institucion</label><input type=\"text\" id=\"v-empresa-ctx\" placeholder=\"Donde trabaja...\"></div>\n              <div class=\"fld\"><label>Detalles de lo que hace</label><input type=\"text\" id=\"v-rol-empresa\" placeholder=\"Que hace concretamente en su trabajo...\"></div>\n              <div class=\"fld\"><label>Trabaja ahi desde</label><input type=\"date\" id=\"v-trabajo-desde\"></div>\n            </div>\n          </div>\n          <div class=\"fld\" style=\"margin-top:10px;\"><label>Estudios</label><input type=\"text\" id=\"v-estudios\" placeholder=\"Carrera, institucion, nivel...\"></div>\n          <!-- Hobbies expandido -->\n          <div class=\"fld\" style=\"margin-top:10px;\">\n            <label>Hobbies, intereses y estilo de vida</label>\n            <div class=\"ch ambulo, muy activo, sedentario, vegano, etc...\"></textarea></div>\n        </div>\n\n        <!-- 4. Hitos importantes -->\n        <div class=\"obs-block\" style=\"background:#EEF2FF;border-color:#C7D2FE;\">\n          <h4 style=\"color:#4338CA;\">4. ✨ Hitos importantes de vida</h4>\n          <p style=\"font-size:11px;color:#6B7280;margin-bottom:8px;\">Solo registrar si el cliente lo compartio voluntariamente.</p>\n          <div class=\"chk-group\" style=\"flex-direction:column;gap:6px;\">\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"nacimiento-hijo\" onchange=\"toggleHitoDetail('h-nac',this.checked)\"><span>👶 Nacimiento de hijo/a</span></label>\n            <div id=\"h-nac\" style=\"display:none;margin-left:28px;padding:10px;background:#fff;border-radius:8px;border:1px solid #C7D2FE;\">\n              <div class=\"fgrid col2\" style=\"gap:8px;\">\n                <div class=\"fld\"><label>Nombre del hijo/a</label><input type=\"text\" id=\"h-nac-nombre\" placeholder=\"Nombre...\"></div>\n                <div class=\"fld\"><label>Fecha de nacimiento</label><input type=\"date\" id=\"h-nac-fecha\" onchange=\"showZodiacNext(this)\"><div class=\"zodiac-inline\" id=\"h-nac-fecha-zodiac\"></div></div>\n              </div>\n            </div>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"matrimonio\" onchange=\"toggleHitoDetail('h-mat',this.checked)\"><span>💍 Matrimonio o compromiso</span></label>\n            <div id=\"h-mat\" style=\"display:none;margin-left:28px;padding:10px;background:#fff;border-radius:8px;border:1px solid #C7D2FE;\">\n              <div class=\"fgrid col2\" style=\"gap:8px;\">\n                <div class=\"fld\"><label>Nombre de la pareja</label><input type=\"text\" id=\"h-mat-nombre\" placeholder=\"Nombre...\"></div>\n                <div class=\"fld\"><label>Fecha del evento</label><input type=\"date\" id=\"h-mat-fecha\" onchange=\"showZodiacNext(this)\"><div class=\"zodiac-inline\" id=\"h-mat-fecha-zodiac\"></div></div>\n              </div>\n            </div>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"nuevo-trabajo\"><span>💼 Nuevo trabajo o proyecto</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"fin-estudios\"><span>🎓 Termino de estudios</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"duelo\"><span>🕊️ Duelo o perdida significativa</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"recuperacion\"><span>🌱 Recuperacion personal</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"logro\"><span>🏆 Logro importante</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"viaje\"><span>✈️ Viaje significativo</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-hito\" value=\"cambio-simbolico\"><span>🔮 Cambio espiritual, emocional o simbolico</span></label>\n          </div>\n          <div class=\"fld\" style=\"margin-top:10px;\"><label>Descripcion del hito compartido</label><textarea id=\"v-hito-desc\" rows=\"2\" placeholder=\"Que compartio, en que contexto...\"></textarea></div>\n        </div>\n\n        <!-- 5. Fechas: auto-fill -->\n        <div class=\"obs-block\" style=\"background:#EEF2FF;border-color:#C7D2FE;\">\n          <h4 style=\"color:#4338CA;\">5. 📅 Fechas y momentos importantes</h4>\n          <p style=\"font-size:10px;color:#6B7280;margin-bottom:8px;\">Estas fechas se completan automaticamente con la informacion ingresada en los campos anteriores. Puedes editarlas manualmente si es necesario.</p>\n          <div id=\"fechas-auto-display\" style=\"background:#fff;border:1px solid #C7D2FE;border-radius:8px;padding:12px;font-size:12px;line-height:1.8;color:var(--ink2);min-height:60px;\">\n            <span style=\"color:var(--muted);font-size:11px;\">Se completara automaticamente al llenar los datos de personas e hitos...</span>\n          </div>\n          <div class=\"fld\" style=\"margin-top:10px;\"><label>Notas adicionales de fechas</label><textarea id=\"v-proximo-evento\" rows=\"2\" placeholder=\"Proximo evento importante, algo que menciono que se viene...\"></textarea></div>\n          <input type=\"hidden\" id=\"v-cumple-hijos\">\n          <input type=\"hidden\" id=\"v-fecha-tatoo\">\n          <input type=\"hidden\" id=\"v-aniversario\">\n        </div>\n\n        <!-- 6. Preferencias de conversacion -->\n        <div class=\"obs-block\" style=\"background:#EEF2FF;border-color:#C7D2FE;\">\n          <h4 style=\"color:#4338CA;\">6. 💬 Preferencias de conversacion</h4>\n          <div class=\"chk-group\" style=\"flex-direction:column;gap:6px;\">\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"conversar\"><span>Le gusta conversar durante la sesion</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"silencio\"><span>Prefiere estar en silencio</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"arte\"><span>Le gusta hablar de arte</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"familia\"><span>Le gusta hablar de familia</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"musica\"><span>Le gusta hablar de musica</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"viajes\"><span>Le gusta hablar de viajes</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"espiritualidad\"><span>Le gusta hablar de espiritualidad</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"significado\"><span>Le gusta hablar del significado del tatuaje</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"temas-livianos\"><span>Prefiere temas livianos</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"evitar-personal\"><span>Prefiere evitar temas personales</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"evitar-emocional\"><span>Prefiere evitar temas emocionales</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"ia\"><span>🤖 Le interesa la Inteligencia Artificial</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"neurociencia\"><span>🧠 Le interesa la Neurociencia</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"filosofia\"><span>💡 Le interesa la Filosofia</span></label>\n            <label class=\"chk-item chk-card\"><input type=\"checkbox\" name=\"v-conv\" value=\"musica-profunda\"><span>🎵 Le gusta la musica (profundizar)</span></label>\n          </div>\n        </div>\n\n        <!-- 7. Resumen humano -->\n        <div class=\"obs-block\" style=\"background:#EEF2FF;border-color:#C7D2FE;\">\n          <h4 style=\"color:#4338CA;\">7. 📝 Resumen humano para proxima sesion</h4>\n          <p style=\"font-size:11px;color:#6B7280;margin-bottom:8px;\">Escribe en tus propias palabras lo que quieres recordar de esta persona la proxima vez que la atiendas.</p>\n          <div class=\"fld\"><textarea id=\"v-resumen-humano\" rows=\"5\" placeholder=\"Ej: Viene de Concepcion, tiene dos hijas (Sofia y Valentina). Se tatua en honor a su
